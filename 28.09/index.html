<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>


        //1.
        //Event Loop (OLay Döngüsü) ve görev öncelik sırası

        console.log("1.Sıra Klinik Sitesi Açıldı");

        setTimeout(() => {
            console.log("2.Sıram (zamanlayıcı): Randevu Hatırlatma SMS'i Gönderildi (Macro Task)")

        }, 0);


        Promise.resolve().then(() => {
            console.log("3.Promise: VIP Müşteri Öncelikli Kaydı Alındı (Micro Task)")
        });


        console.log("4.Resepsiyon işlemleri devam ediyor");





        //2.
        // Callback Hell (Geri Çağırma Cehennemi)

        danisanbul("Selin Kaya", (danisan) => {
            ciltTipiAnaliziEt(danisan.id), (analiz) => {
                uygunSerumuBelirle(analiz.tip, (serum) => {
                    stosDus(serum.id, (fatura) => {
                        console.log("İşlem Tamamlandı", fatura);
                    })
                })
            }
        })







        //3.

        //Bu kod, bir randevu sisteminin asenkron (zaman alan) yapısını simüle eden tam bir akış şablonudur. 
        // İşlem iki ana kısımdan oluşur: Asıl işi yapan ve sonucu vaat eden Promise kısmı ve bu vaadin sonucunu yakalayıp işleyen Zincir (.then, .catch, .finally) kısmı.


        //Burada randevuOlustur adında bir fonksiyon tanımlanıyor. Bu fonksiyon çağrıldığında hemen bitmeyecek bir iş başlatır ve geriye bir Promise döndürür.
        // Promise: "Şu an elimde sonuç yok ama iş bitince sana başarılı (resolve) veya başarısız (reject) bir cevap vereceğim" sözüdür.
        // resolve: İşlem sorunsuz bittiğinde veriyi dışarı aktaran tetikleyicidir.
        // reject: İşlemde hata çıktığında süreci durdurup hata fırlatan tetikleyicidir.

        const randevuOlustur = (danisanAdi, hizmet, uzmanMusaitMi) => {

            // Süreç başlar başlamaz ekrana sorgulamanın başladığı yazılır. 
            // Ardından setTimeout ile 1.5 saniyelik bir geri sayım başlatılır. 
            // Bu, gerçek hayatta sunucuya istek atıp veritabanından cevap bekleme süresini temsil eder. Sistem kilitlenmez, arka planda süre sayılır.
            return new Promise((resolve, reject) => {
                //Fonksiyon çağrılır çağrılmaz konsola bilgi basılır:
                // Meryem Tur için "Medikal Bakım" seansı sorgulanıyor
                console.log(`${danisanAdi} için "${hizmet}" seansı sorgulanıyor`);

                //setTimeout(..., 1500): Gerçek hayatta veritabanına bağlanmak veya sunucuya gidip gelmek vakit alır. Burada 1.5 saniyelik sunucu bekleme süresi taklit ediliyor.
                //1.5 saniye sonra sistem bakar: uzmanMusaitMi değeri nedir?
                //Eğer true ise: randevuDetay adında bir obje üretir (rastgele bir takip numarası, saat vs.) ve resolve(randevuDetay) diyerek bu objeyi dışarı fırlatır.
                //Eğer false olsaydı: reject(...) diyerek hata fırlatacaktı.

                setTimeout(() => {
                    if (uzmanMusaitMi) {
                        const randevuDetay = {
                            takipno: "BİO-" + Math.floor(1000 + Math.random() * 9000),
                            danisan: danisanAdi,
                            hizmet: hizmet,
                            saat: "14:30",
                            onaylandi: true
                        };

                        resolve(randevuDetay);
                    } else {
                        reject(new Error("Seçilen Saatte uzman randevusu doludur"));
                    }
                }, 1500); // 1.5 saniye sunucu gecikmesi (simülasyon)
            }

            )
        }

        //Fonksiyonu çağırdık 
        // (uzmanMusaitMi parametresine true verdik). Fonksiyon 1.5 saniye çalıştı ve resolve(randevuDetay) çalıştı.
        randevuOlustur("Meryem Tur", "Medikal Bakım", true)

            //resolve içindeki randevuDetay objesi buradaki randevu parametresine gelir.
            //Ekrana objeyi basar:
            //Randevu Onaylandı { takipno: "BİO-4821", danisan: "Meryem Tur", ... }
            //Çok Önemli: return ile geriye bir metin döndürüyor (return 'Kayıt No: ...'). Bir .then() bloğunun içinden return edilen değer, doğrudan bir sonraki .then() bloğuna parametre olarak aktarılır.
            .then((randevu) => {
                console.log("Randevu Onaylandı", randevu);
                return `Kayıt No: ${randevu.takipno}`; // Bir sonraki then bölümüne aktarılır
            })

            //Bir önceki .then'in return ettiği "Kayıt No: BİO-XXXX" metni buradaki mesaj değişkenine düşer.
            // Ekrana basılır:
            // SMS Gönderildi-> Kayıt No: BİO-XXXX
            .then((mesaj) => {
                console.log("SMS Gönderildi->", mesaj);
            })

            //Kronolojik Olarak Ekranda Ne Görürsün? 
            // //(0. saniyede hemen basılır):
            // //Meryem Tur için "Medikal Bakım" seansı sorgulanıyor
            //(1.5 saniye beklenir...)
            //(1.5 saniye dolunca ilk .then çalışır):
            //Randevu Onaylandı { takipno: "BİO-5832", danisan: "Meryem Tur", hizmet: "Medikal Bakım", saat: "14:30", onaylandi: true }
            //(Hemen peşinden ikinci .then çalışır):
            //SMS Gönderildi-> Kayıt No: BİO-5832
            .catch((hata) => {
                console.error("İşlem Başarısız:", hata.message);
            })
            .finally(() => {
                console.log("Randevu Sorgulama Oturumu Kapatıldı/Tamamlandı");
            });

        //burada bir Promise zincirinin 4 temel ayağını tamamlamış oldu:
        // //.then(...) (Her Şey Yolunda Gittiğinde):
        // Promise başarıyla tamamlandığında (resolve çağrıldığında) çalışır. İlk .then randevu verisini alır, ikinci .then ise üretilen SMS mesajını ekrana basar.
        // .catch(...) (Bir Terslik Çıktığında):
        // Fonksiyon içinde reject(...) tetiklenirse veya zincirdeki .then bloklarının herhangi birinde beklenmedik bir hata fırlatılırsa doğrudan buraya atlar. Aradaki diğer .then'ler atlanır ve hata yakalanıp konsola basılır.
        // (Örneğin fonksiyona true yerine false verseydin .then'ler hiç çalışmayacak, doğrudan .catch devreye girip "Seçilen Saatte uzman randevusu doludur" yazacaktı).
        // .finally(...) (Sonuç Ne Olursa Olsun):
        // İşlem ister başarıyla (resolve) tamamlansın, ister hatayla (reject) sonuçlansın her iki durumda da en son mutlaka çalışır. Genellikle yükleniyor (spinner/loader) animasyonunu kapatmak, açık bir oturumu veya veritabanı bağlantısını sonlandırmak gibi temizlik işleri için kullanılır.



        //Eski "Callback Hell" örneğindeki iç içe giren karmaşık yapıyı ortadan kaldırmak için. 
        // Her adımı bir bant gibi birbirine bağladı: 
        // Önce randevuyu oluşturdu, işi bitince onay detayını aldı, oradan çıkan takip numarasını da alıp bir sonraki adıma (SMS'e) pasladı. 
        // Her şey temiz ve düz bir zincir halinde aktı.








        //4.

        //dışarıdan verilen hizmet türüne (örneğin "Lazer Epilasyon" veya "Lipo") karşılık gelen ücreti asenkron olarak (1 saniye gecikmeyle) hesaplayan bir Promise fonksiyonu yazıyoruz.

        const seansUcretiHesapla = (hizmetTipi) => {    //Fonksiyon dışarıdan bir hizmetTipi (metin) parametresi alır.
            return new Promise((resolve) => {    //Fonksiyon geriye bir Promise döndürür. (Bu kez hata durumu yani reject eklenmemiş, sadece başarılı durum yani resolve kullanılmış).
                setTimeout(() => {    //Klinik hizmetlerinin fiyatlarının tutulduğu bir obje tanımlanmıştır:
                    const tarifeler = {
                        "Lazer Epilasyon": 2800,
                        "İğneli Epilasyon": 4500,
                        "Lipo": 6500
                    }
                    resolve(tarifeler[hizmetTipi] || 1500);   //Gönderilen hizmetTipi tarifeler objesinde aranır (örneğin tarifeler["Lazer Epilasyon"] yazılırsa sonuç 2800 olur).
                    //Eğer listede olmayan farklı bir hizmet yazılırsa (|| 1500 sayesinde) sistem otomatik olarak varsayılan ücret olan 1500 TL'yi döndürür ve resolve ile dışarı fırlatır.
                }, 1000)    //Tıpkı önceki örneklerdeki gibi 1 saniyelik bir sunucu/veritabanı gecikmesi simüle edilir.

            })
        };


        //Önceki .then().catch() zinciri yerine, kodun sanki normal düz (senkron) bir kodmuş gibi alt alta, tertemiz ve okunaklı çalışmasını sağlayan en güncel yöntemdir.
        //Bir fonksiyonun başına async yazıldığında, o fonksiyonun içinde await (bekle) kelimesini kullanabilir hale gelirsin. Bu, JavaScript'e "Bu fonksiyon asenkron çalışacak, içindeki bazı işlemlerin bitmesini beklememiz gerekecek" der.
        const randevuSureciBasla = async (danisan, hizmet) => {
            try {   //try: "Hatasız senaryoda şu adımları sırayla sırtla ve çalıştır" bloğudur.
                console.log(`1.Adım ${danisan} için işlem başlatılıyor`);

                //await randevuOlustur(...): JavaScript'e "Dur! Burada 1.5 saniyelik bir bekleme var, randevuOlustur işini tamamen bitirip bize sonucu (randevu objesini) verene kadar bir sonraki satıra geçme" der. 
                // Sonuç gelince randevu değişkenine atar.
                const randevu = await randevuOlustur(danisan, hizmet, true);
                console.log(`2.Adım Randevu Onaylandı. Takip No: ${randevu.takipNo}`);

                //await seansUcretiHesapla(hizmet): Aynı şekilde bir önceki adım bittikten sonra bu kez fiyat hesaplama fonksiyonunun bitmesini bekler, gelen ücreti tutar değişkenine kaydeder.
                const tutar = await seansUcretiHesapla(hizmet);
                console.log(`Seans Ücreti: ${tutar} ₺ KDV Dahildir. Kayıt Tamamlandı!`);

                //En sonda ise başarılı olduğuna dair bir özet nesneyi (return { ... }) dışarı döndürür.
                return { basarili: true, takipNo: randevu.takipNo, toplam: tutar };

                //Eğer try bloğu içindeki herhangi bir await işleminde (örneğin uzmanın müsait olmaması durumunda) bir reject veya beklenmedik bir hata fırlatılırsa, kod anında try'ı bırakıp buraya düşer.
                //Uygulamanın çökmesini engeller, hatayı yakalayıp konsola yazar ve başarısız sonuç döndürür.
            } catch (err) {
                console.error("Hata oluştu:", err.messaje);
                return { basarili: false, hata: err.message }

                //İşlem ister başarıyla (try ile) tamamlansın, ister hataya düşüp (catch ile) sonlansın, fark etmeksizin her koşulda en son çalışan garanti bloktur.
                //Genellikle yüklenme animasyonlarını kapatmak veya "İşlem bitti" mesajını basmak için kullanılır.
            } finally {
                console.log("Seans Akışı Tamamlandı");
            }

        }

        //Çalıştırma
        randevuSureciBasla("Meryem Tur", "Lipo");









        //5.

        //web sitelerinde veya uygulamalarda birden fazla veriyi (doktor listesi, oda müsaitlikleri, kampanyalar) aynı anda (paralel olarak) en hızlı şekilde nasıl çekebileceğimizi gösteren çok önemli bir performans tekniği anlatılıyor.

        ///Burada sunucudan veri çeken 3 ayrı asenkron işlem (Promise) tanımlanmış.
        ////Her birinin sunucudan gelme süresi (gecikmesi) farklı:
        //Doktorlar 1.2 saniyede (1200ms),
        // Odalar 0.8 saniyede (800ms),
        // Kampanyalar 1 saniyede (1000ms) geliyor.

        const fetchDoktorlar = new Promise(res => setTimeout(() => res
            (["Dr.Bengünur", "Dr.Ahmet"]), 1200));

        const fetchOdaMusaitlik = new Promise(res => setTimeout(() => res
            (["VIP ODA", "Lazer ODASI"]), 800));

        const fetchGunlukKampanyalar = new Promise(res => setTimeout(() =>
            (["%15 Sonbahar Kampanyası", "2 masaj alana 1 hediye"]), 1000));


        const verileriYukle = async () => {

            //console.time("..."): Tarayıcının konsoluna bir kronometre başlatır. 
            //Bu fonksiyonun çalışmaya başladığı an ile bittiği an arasındaki süreyi milisaniye cinsinden ölçmek için kullanılır.
            console.time("Paralel Yükleme Süresi");
            try {
                const [doktorlar, odalar, kampanyalar] = await Promise.all([

                    //Promise.all ne yapıyor? Bütün bu istekleri aynı anda (paralel olarak) fırlatır. İsteklerin hepsi arka planda aynı anda başlar.
                    //Toplam Süre Ne Kadar Sürer? En yavaş olan işlem hangisiyse (burada 1200ms yani doktorlar) süreç o kadar sürer. Yani 3 saniye beklemek yerine sadece 1.2 saniyede bütün veriler aynı anda cebimize gelir!
                    //Dizi Destikleme (Destructuring): Gelen sonuçlar sırasıyla [doktorlar, odalar, kampanyalar] değişkenlerine tek satırda paketinden çıkarılarak atanır.
                    fetchDoktorlar(),
                    fetchOdaMusaitlik(),
                    fetchGunlukKampanyalar()
                ]);

                //Hepsi başarıyla geldikten sonra konsola sırasıyla veriler yazdırılır.

                console.log("Doktorlar:", doktorlar);
                console.log("Odalar:", odalar);
                console.log("Kampanyalar:", kampanyalar);
            }

            //Promise.all yapısının en önemli kuralı "Hepsi ya da Hiçbiri" kuralıdır (All-or-Nothing).
            //İçerideki 3 istekten sadece 1 tanesi bile hata verse (reject olsa), diğer ikisi başarıyla tamamlanmış olsa bile Promise.all direkt catch bloğuna düşer. Yani tek bir bozuk istek, tüm sayfayı hataya düşürebilir.
            catch (err) {
                console.log("Herhangi bir istek başarısız olursa hepsi düşer:", err);
            }

            //console.timeEnd(...): Başlattığımız kronometreyi durdurur ve konsola "Paralel Yükleme Süresi: 1215ms" gibi bir süre basarak bu paralel yöntemin ne kadar hızlı bittiğini kanıtlar.
            console.timeEnd("Paralel Yükleme Süresi");
        }
        verilerYukle();   //yazdığımız bu ana fonksiyonu tetikleyerek süreci başlatır.










        //6.

        //gerçek bir dış dünya (Rest API) sunucusundan internet üzerinden gerçek veri çekme işlemini yapalım.

        //Asenkron Fonksiyonun Başlatılması
        //async: İçerisinde await kullanabilmek için fonksiyon asenkron olarak tanımlanmıştır.
        //ry { ... }: İnternetten veri çekme gibi işlemlerde sunucunun kapalı olması, internetin kopması gibi riskler her zaman vardır. Bu yüzden kodun güvenli çalışması ve hata yönetimi yapılabilmesi için try-catch bloğu içine alınmıştır.
        // İlk satırda konsola harici API'ye bağlanıldığını belirten bilgi mesajı yazdırılır.

        const kozmetikUrunleriniGetir = async () => {
            try {
                console.log("Harici Apiye Bağlanılıyor");

                //fetch ile İnternetten İstek Atma (await)
                //fetch(...): JavaScript'in tarayıcı içinde dış dünyadaki bir adresten (URL) veri almak için kullandığı yerleşik komuttur.
                //await: İnternet üzerinden veri gelmesi milisaniyeler veya saniyeler sürebileceği için, JavaScript'e "Sunucu yanıt verene kadar burada bekle, yanıt gelmeden alt satıra geçme" komutu verilir. Gelen sonuç response değişkenine atanır.

                const response = await fetch("https://dummyjson.com/products/category/beauty");

                //HTTP Hata Kontrolü (response.ok)
                //İnternet sitelerinden veri çekerken her zaman her şey yolunda gitmeyebilir (örneğin sayfa bulunamadı 404 hatası verebilir veya sunucu çökmüş olabilir 500 hatası dönebilir).
                // response.ok: Gelen yanıtın başarılı (200 aralığında) olup olmadığını kontrol eder. Eğer başarılı değilse (!response.ok), duruma el koyup özel bir hata fırlatılır (throw new Error) ve kod doğrudan alttaki catch bloğuna yönlendirilir.

                if (!response.ok) {
                    throw new Error(`Http Hatası: ${response.status}`);
                }

                //Sunucudan ham olarak gelen veri, doğrudan okunamaz (saf metin/akış halindedir).
                // await response.json(): Gelen ham veriyi JavaScript objesine/dizisine çevirir. Bu da zaman alan bir işlem olduğu için başına await konulmuştur.
                // Çevrilen verinin içindeki ürünlerin toplam adedi konsola yazdırılır.

                const data = await response.json();
                console.log(`Toplam ${data.products.length} adet kozmetik ürün çekildi`);


                //Gelen devasa ürün listesinin tamamını kalabalık yapmasın diye işlemek yerine şu işlemlerle süzülüyor:
                // .slice(0,3): Gelen listeden sadece ilk 3 ürünü alır.
                //.map(p => ({ ... })): O 3 ürünün içindeki binlerce gereksiz detayı (açıklama, resim linki vs.) atıp, sadece bizim belirlediğimiz 3 alanı (urun, fiyat, stok) seçerek yepyeni temiz bir liste (vitrin) oluşturur.

                const vitrin = data.products.slice(0, 3).map(p => ({
                    urun: p.title,
                    fiyat: p.price,
                    stok: p.stock
                }));

                //Normal console.log yerine veriyi konsolda düz metin olarak değil, çok şık bir tablo (kolonlar ve satırlar halinde) gösterir. (Not: Paylaştığın kodda konsola yazdıran satır console.table(vitrin); şeklindedir).
                console.table(vitrin);
            }
            catch (err) {    //İstek sırasında herhangi bir hata olursa (internet kopması, yanlış URL vb.) uygulamanın çökmesini engeller.
                console.warn("Api Hatası", err.message);
            }
        }

        kozmetikUrunleriniGetir();








        //6. Örneğe Benzer Hocanın Derste Yapmamızı İstediği Örnek:

        // AMAÇ: Gelen devasa veriyi al, istemediğin kısımları kırp, içinden sadece sana lazım olanları seç ve ekrana bas.

        //Bağlantı Kurma ve Güvenlik Ağı (async ve try-catch)
        //Her zamanki gibi fonksiyonumuzu async olarak başlattık çünkü internetten veri çekmek zaman alacak ve sistemi bekletmemiz (await) gerekecek.
        //İşlemleri try bloğu içine aldık ki sunucuda bir çökme olursa kodumuz patlamasın, güvenle hatayı yakalayabilelim.
        
        const seciliUrunleriGetir = async () => {
            try {
                const response = await fetch("https://dummyjson.com/products");  //fetch ile linke bağlandık ve ürünlerin listesini talep ettik.

                if (!response.ok) {   //Yanıt başarılı mı diye kontrol ettik (response.ok).
                    throw new Error(`Http Hatası: ${response.status}`);
                }

                const data = await response.json();   //Gelen karmaşık ve okunmaz haldeki yanıtı, JavaScript'in anlayabileceği formata, yani JSON formatına çevirdik (await response.json()). Artık tüm ürünler data.products dizisinin (kutusunun) içinde duruyor.
               
                //Diziyi Kırpma İşlemi: Hangi Ürünleri Alacağız? (slice)
                //Programlamada saymaya 0'dan başlanır. (0. ürün, 1. ürün, 2. ürün...)
                //slice(2, 7) komutu sisteme şunu der: "2. indeksten başla, 7. indekse geldiğinde dur ve onu alma." Böylece tam istediğin gibi 2, 3, 4, 5 ve 6. sıradaki ürünleri (toplam 5 ürün) koparıp almış olduk.

                //İstenilen Özellikleri Ayıklama (map)
                //map döngüsü, bu 5 ürünü tek tek gezer (her birine p yani product dedik) ve sadece senin istediğin alanları cımbızla çekerek yepyeni bir obje oluşturur.

                const vitrin = data.products.slice(2, 7).map(p => ({      
                    kategori: p.category,
                    fiyat: p.price,
                    stok: p.stock,
                    etiketler: p.tags.join(", ")   //join(", ") ne yaptı?: Dizinin içindeki o kelimeleri aldı, aralarına birer "virgül ve boşluk" koyarak tek bir pürüzsüz metne dönüştürdü.
                }));  


                //Hazırladığımız tam 5 elemanlı yeni listemizi console.table(vitrin) diyerek konsola şık bir tablo olarak çizdirdik.
                console.table(vitrin);
            } catch (hata) {
                console.error("Veri çekilirken hata oluştu:", hata.message);   //Eğer internette veya linkte bir sorun olursa sistem sessiz kalmayacak, konsola kırmızı renkte hata mesajını basacaktır.
            }
        };

        seciliUrunleriGetir();  
        //fonksiyonu tetikleyen, yani çalıştıran ateşleme düğmesidir.
        //sisteme şunu söyler: "Hadi şimdi yukarıdaki her şeyi sırasıyla uygulamaya başla ve internete bağlan!"


        
    </script>

</body>

</html>
