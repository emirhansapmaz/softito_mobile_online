<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenli Form</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            background: #f8fafc;
            max-width: 500px;
            margin: 0 auto;
        }
    .field {
        margin-bottom: 16px;
    }

    label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 13px;
        color: #334155;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 2px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 15px;
        background: #ffffff;
    }

    input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }

    input:user-invalid {
        border-color: #ef4444;
        background: #fef2f2;
    }

    input:user-valid {
        border-color: #10b981;
        background: #f0fdf4;
    }

    .err {
        display: none;
        color: #ef4444;
        font-size: 12px;
        margin-top: 4px;
    }

    input:user-invalid + .err {
        display: block;
    }

    .hp-trap {
        display: none;
    }

    button {
        width: 100%;
        background: #10b981;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background: #059669;
    }
</style>
</head>
<body>
<h3>Kurumsal Üye Kayıt Formu</h3>

<form action="/kayit" method="POST">
    <!-- Bot Tuzlası (HoneyPot) -->
    <input type="text" name="bot_check" class="hp-trap" tabindex="-1" autocomplete="off">

    <div class="field">
        <label for="tc">TC Kimlik NO (11 hane)</label>
        <input type="text" id="tc" name="tc_number" required inputmode="numeric" maxlength="11" 
            pattern="^[1-9]{1}[0-9]{9}[02468]{1}$"
            title="11 haneli olmalı, 0 ile başlayamaz ve çift rakamla bitmelidir" 
            enterkeyhint="next">
        <span class="err">Geçerli bir tc kimlik numarası giriniz</span>
    </div>

    <div class="field">
        <label for="tel">Cep Telefonu</label>
        <input type="tel" id="tel" name="phone" required
            pattern="^(?:\+90|0)?\s?([23489]\d{2}|\s?5\d{2})\s?\d{3}\s?\d{2}\s?\d{2}$" 
            placeholder="05370633162"
            enterkeyhint="next">
        <span class="err">Geçerli bir cep telefonu numarası giriniz.</span>
    </div>

    <div class="field">
        <label for="password">Güçlü Şifre</label>
        <input type="password" id="password" name="password" required minlength="8"
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
            enterkeyhint="done">
        <span class="err">Şifre en az 8 karakter, büyük küçük harf, rakam ve özel karakter içermelidir.</span>
    </div>

    <button type="submit">Kayıt Ol</button>
</form>
</body>
</html>
